name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Run build script
        run: |
          rm -f deploy/micropython/esp*/*
          rm -f deploy/micropython/wipy/*/*
          cd tools
          chmod +x micropython-make.sh
          ./micropython-make.sh
      
      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            deploy/* \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
