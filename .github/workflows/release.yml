name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Run build script
        run: |
          rm -f deploy/micropython/esp*/*
          rm -f deploy/micropython/wipy/*/*
          cd tools
          chmod +x micropython-make.sh
          ./micropython-make.sh
          find deploy/micropython/ -type f -exec ls -lh {} \;
      
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: deploy/*
      
      - name: Create Release
        #if: github.event_name == 'push'
        run: |
          gh release create ${{ github.ref_name }} \
            deploy/* \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
