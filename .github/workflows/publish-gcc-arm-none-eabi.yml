name: Publish gcc-arm-none-eabi (wipy) image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-gcc-arm-none-eabi.yml"
      - "tools/build-ports/wipy/Dockerfile"

permissions:
  # for ghcr.io (docker registry):
  packages: write

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the docker image
        run: |
          tag=ghcr.io/hwinther/lanot/gcc-arm-none-eabi:10.3-2021.10
          tag_latest=ghcr.io/hwinther/lanot/gcc-arm-none-eabi:latest
          echo tag=$tag tag_latest=$tag_latest
          docker build tools/build-ports/wipy -t $tag -t $tag_latest -f tools/build-ports/wipy/Dockerfile
          docker push $tag
          docker push $tag_latest