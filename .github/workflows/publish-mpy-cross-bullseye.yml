name: Publish mpy-cross (generic gcc/make) image for debian bullseye as a temporary workaround

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-mpy-cross-bullseye.yml"
      - "tools/build-ports/mpy-cross/Dockerfile.bullseye"

permissions:
  # for ghcr.io (docker registry):
  packages: write

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the docker image
        run: |
          tag=ghcr.io/hwinther/lanot/mpy-cross:bullseye
          echo tag=$tag
          docker build tools/build-ports/mpy-cross -t $tag -f tools/build-ports/mpy-cross/Dockerfile.bullseye
          docker push $tag