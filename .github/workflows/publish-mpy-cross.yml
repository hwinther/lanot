name: Publish mpy-cross (generic gcc/make) image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-mpy-cross.yml"
      - "tools/build-ports/mpy-cross/Dockerfile"

permissions:
  # for ghcr.io (docker registry):
  packages: write

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the docker image
        run: |
          tag=ghcr.io/hwinther/lanot/mpy-cross:13
          tag_latest=ghcr.io/hwinther/lanot/mpy-cross:latest
          echo tag=$tag tag_latest=$tag_latest
          docker build tools/build-ports/mpy-cross -t $tag -t $tag_latest -f tools/build-ports/mpy-cross/Dockerfile
          docker push $tag
          docker push $tag_latest