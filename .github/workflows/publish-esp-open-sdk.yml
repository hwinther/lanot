name: Publish esp-open-sdk (esp8266) image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-esp-open-sdk.yml"
      - "tools/build-ports/esp8266/Dockerfile"

permissions:
  # for ghcr.io (docker registry):
  packages: write

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the docker image
        run: |
          git clone --recursive https://github.com/hwinther/esp-open-sdk.git

          tag=ghcr.io/hwinther/lanot/esp-open-sdk:2.1.0
          tag_latest=ghcr.io/hwinther/lanot/esp-open-sdk:latest
          echo tag=$tag tag_latest=$tag_latest
          docker build tools/build-ports/esp8266 -t $tag -t $tag_latest -f esp-open-sdk/Dockerfile esp-open-sdk
          docker push $tag
          docker push $tag_latest